  project_items:
    backyard_ai:
      title: "Backyard AI"
      category: "Arquitectura Paisajística con IA Generativa"
      description: "Plataforma de rediseño paisajístico de exteriores impulsada por Inteligencia Artificial generativa multimodal (Google Gemini Vision y Nano Banana). Analiza fotos del patio, condiciones de luz solar y suelo para generar propuestas fotorrealistas con flora nativa conservando las estructuras originales."
    ordenapp:
      title: "OrdenApp"
      category: "SaaS Empresarial de Mantenimiento y Órdenes"
      description: "Plataforma SaaS empresarial para la gestión integral de instalaciones, órdenes de trabajo y mantenimiento predictivo en tiempo real. Optimiza la coordinación y despacho de técnicos de campo, inventario y seguimiento de activos."
    drumplay:
      title: "DrumPlay"
      category: "Plataforma Interactiva para Batería Electrónica"
      description: "Plataforma interactiva de aprendizaje y práctica para batería electrónica (optimizada para Alesis Nitro Mesh). Destaca por su sistema de pentagrama doble en tiempo real que compara la partitura oficial con la transcripción DSP del audio y conectividad Web MIDI."
    alarmtronics_voice_dispatch:
      title: "Alarmtronics Voice Dispatch"
      category: "Telefonía con IA Conversacional Multimodal"
      description: "Recepcionista y despachador de voz con IA en tiempo real para llamadas de emergencia en alarmas de incendio e intrusión. Integrado vía WebSockets con telefonía Telnyx TeXML y la API Google Gemini Live con voz neuronal y detección de interrupciones."
    autonomous_rv_off_grid_energy_grid:
      title: "Red de Energía Autónoma Off-Grid para RV"
      category: "Hardware IoT y Monitoreo de Energía Solar"
      description: "Ecosistema de energía solar aislado (off-grid) con controladores ESP32 y Raspberry Pi. Integración de sensores industriales y controladores de carga vía Modbus RTU y broker MQTT para telemetría en tiempo real de baterías y paneles solares."
    commercial_low_voltage_life_safety_smart_security_integration:
      title: "Integración Comercial de Baja Tensión, Seguridad y Automatización"
      category: "Caso de Estudio 03"
      description: "Ejecución en campo, cableado estructurado y puesta en marcha de sistemas en Florida Central. Implementación de paneles de intrusión (DSC Neo, PowerSeries, Honeywell), lazos de detección de incendio (circuitos SLC y NAC, dispositivos direccionables y convencionales), hardware de control de acceso (electroimanes, cantoneras eléctricas, lógica de relés, fuentes Altronix) y racks MDF/IDF bajo normativas NEC y TIA/EIA-568, integrados con automatización Z-Wave en Alarm.com."
      highlight_title: "Commercial & Life Safety"
      highlight_subtitle: "NEC & Florida FASA/BASA Compliant Field Deployments"