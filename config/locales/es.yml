      title: "Nicolás Mahecha Duarte | Ingeniero de Integración Edge-to-Cloud"
      description: "Ingeniero Electrónico especializado en SCADA, IoT y desarrollo de software full-stack con Ruby on Rails, Python y AWS. Certificado FASA/BASA."
    hero:
      title: "Nicolás Mahecha Duarte"
      subtitle: "Ingeniero de Integración Edge-to-Cloud"
      tagline: "Conectando el hardware de campo (Seguridad, IoT, Automatización) con soluciones inteligentes en la nube en Florida."
      cta_calendly: "Agendar Consulta Técnica Gratuita"
      cta_resume: "Descargar Currículum Profesional (PDF)"
    about:
      title: "Sobre Mí y Propuesta de Valor"
      description: "Ingeniero Electrónico con más de 10 años de experiencia que abarcan la automatización industrial (SCADA/PLC), arquitecturas IoT embebidas y desarrollo de software full-stack (Ruby on Rails, Python, AWS). Trayectoria probada conectando el hardware de campo y los sistemas basados en la nube para optimizar la eficiencia energética y la automatización de edificios. Certificado FASA/BASA con una Maestría en Energía Sostenible de la UBA, especializándose en infraestructuras IoT/SCADA escalables que reducen el tiempo de inactividad e impulsan la eficiencia automatizada."
      buttons:
        about_me: "Sobre Mí"
        explore_projects: "Explorar Proyectos"
        get_in_touch: "Contáctame"
    services:
      title: "Servicios Profesionales"
      subtitle: "Soluciones B2B Empresariales y Consultoría Premium Local"
      industrial_automation:
        title: "Automatización Industrial e Integración SCADA"
        description: "Optimizamos sus líneas de producción y sistemas BAS (Building Automation). Conectamos su hardware de campo mediante protocolos industriales (Modbus, BACnet, OPC-UA) a sistemas de monitoreo centralizado (Ignition) para reducir paradas críticas y costos energéticos."
      fullstack_apps:
        title: "Aplicaciones Web Full-Stack a Medida"
        description: "Desarrollamos plataformas empresariales robustas y escalables con Ruby on Rails y arquitecturas de nube AWS. Diseñamos desde MVPs listos para producción para startups hasta software de gestión operativa para empresas locales."
      smart_iot:
        title: "Soluciones de Gestión Energética e IoT Inteligente"
        description: "Diseño e integración de extremo a extremo de hardware inteligente para el monitoreo de recursos, sistemas de red solar y automatización comercial. Convertimos datos físicos de sensores en tableros de control digitales en tiempo real."
    projects:
      title: "Proyectos Destacados y Casos de Estudio"
      none: "Aún no hay proyectos disponibles."
      check_back: "¡Vuelve pronto para ver novedades!"
      rv_energy:
        title: "Sistema de Energía de Casa Rodante Autónoma (IoT y Sostenibilidad)"
        description: "Diseño y construcción de un ecosistema de energía aislado (off-grid) utilizando ESP32/Raspberry Pi. Diseñé la integración completa de campo conectando múltiples sensores mediante protocolos Modbus/MQTT para el monitoreo en tiempo real de la carga solar, salud de la batería y reciclaje de agua."
      ai_agency:
        title: "Agencia de Software con Agentes de IA (Modernización de OrdenApp)"
        description: "Lideré la modernización del sistema heredado de la plataforma empresarial OrdenApp utilizando Ruby on Rails 8 y Hotwire, reduciendo los tiempos de respuesta operativa en un 25% estimado y aumentando la eficiencia del despacho de técnicos de campo en más de 100 instalaciones activas."
    social_proof:
      title: "Certificaciones y Credenciales"
      subtitle: "Experiencia Técnica Verificada y Cumplimiento de Estándares"
      fasa_basa:
        title: "Certificación FASA/BASA de Florida"
        authority: "Estado de Florida"
        description: "Agente certificado de sistemas de alarma contra incendios (FASA) / sistemas de alarma contra robos (BASA) en conformidad con las normas de seguridad del Estado de Florida."
      uba:
        title: "Maestría en Energía Sostenible"
        authority: "Universidad de Buenos Aires (UBA)"
        description: "Estudios avanzados de posgrado enfocados en la eficiencia de los sistemas de energía, redes verdes e integración de recursos sostenibles."
      ignition:
        title: "Especialista en SCADA Ignition"
        authority: "Inductive Automation"
        description: "Integrador certificado de SCADA con experiencia en la conexión de hardware de campo y PLCs a tableros de control interactivos de Ignition."

