      industrial_automation:
        title: "Automatización Industrial e Integración SCADA"
        description: "Diseño y optimización de líneas de producción y sistemas BMS/BAS. Integración de hardware de campo mediante protocolos industriales (Modbus, BACnet, RS-485, OPC-UA) hacia sistemas de monitoreo centralizado (Ignition) para reducir tiempos de inactividad y costos energéticos."
      fullstack_apps:
        title: "Aplicaciones Web Full-Stack a Medida"
        description: "Desarrollo de plataformas empresariales robustas y escalables utilizando Ruby on Rails 8, Python, PostgreSQL y arquitecturas en la nube AWS, desde software de gestión de operaciones en campo hasta dashboards de telemetría en tiempo real."
      smart_iot:
        title: "IoT Inteligente, Baja Tensión y Gestión Energética"
        description: "Ingeniería e implementación integral en campo de infraestructura comercial de baja tensión, redes de seguridad electrónica, telemetría solar y automatización de edificios inteligentes, convirtiendo datos físicos en control digital en tiempo real."
